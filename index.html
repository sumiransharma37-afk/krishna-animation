<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Divine Emergence – Little Krishna</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: "Times New Roman", serif;
    }
    #credit {
      position: fixed;
      top: 10px;
      right: 20px;
      text-align: center;
      color: #00ffff;
      font-size: 18px;
      text-shadow: 0 0 10px #ff00ff;
      z-index: 10;
    }
    #play-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 14px 28px;
      font-size: 18px;
      letter-spacing: 1px;
      color: #00ffff;
      background: rgba(0,0,0,0.6);
      border: 1px solid #00ffff;
      border-radius: 6px;
      cursor: pointer;
      text-shadow: 0 0 8px #ff00ff;
    }
    #play-btn:hover {
      background: rgba(0,255,255,0.15);
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="credit">Developed by Sumiran Sharma</div>
  <button id="play-btn">Play Divine Animation</button>
  <canvas id="scene"></canvas>

  <!-- Invisible YouTube player for music -->
  <iframe id="music" width="0" height="0" style="position:fixed;border:0"
    src=""
    frameborder="0"
    allow="autoplay">
  </iframe>

  <script>
    // ---------- Scene setup ----------
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- Particle system ----------
    const PARTICLE_COUNT = 10000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);

    // random starting cloud
    for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 10;
      targetPositions[i] = positions[i];
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      size: 0.03,
      color: 0x00ffff,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // ---------- Image -> particle target sampler ----------
    const loader = new THREE.TextureLoader();

    function loadImageTargets(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, (texture) => {
          const img = texture.image;
          const size = 100; // sample grid resolution
          const imgCanvas = document.createElement('canvas');
          imgCanvas.width = size;
          imgCanvas.height = size;
          const ctx = imgCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;

          // collect all bright/opaque pixel coords
          const candidates = [];
          for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
              const i = (y * size + x) * 4;
              const alpha = data[i + 3];
              const brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
              if (alpha > 128 && brightness > 20) {
                candidates.push(x, y);
              }
            }
          }

          if (candidates.length === 0) {
            // no opaque/bright pixels found (e.g. fully transparent or fully black image) —
            // fall back to a scattered cloud instead of producing NaN positions
            resolve(randomScatterPositions());
            return;
          }

          const pairCount = candidates.length / 2;
          const targets = new Float32Array(PARTICLE_COUNT * 3);
          for (let p = 0; p < PARTICLE_COUNT; p++) {
            // cycle through candidates, jitter slightly so particles don't stack in dense/sparse spots
            const ci = (p % pairCount) * 2;
            const x = candidates[ci];
            const y = candidates[ci + 1];
            const jitterX = (Math.random() - 0.5) * 0.03;
            const jitterY = (Math.random() - 0.5) * 0.03;
            targets[p * 3]     = (x - size / 2) * 0.04 + jitterX;
            targets[p * 3 + 1] = -(y - size / 2) * 0.04 + jitterY;
            targets[p * 3 + 2] = (Math.random() - 0.5) * 0.3;
          }
          resolve(targets);
        }, undefined, reject);
      });
    }

    function randomScatterPositions() {
      const scatter = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
        const radius = 4 + Math.random() * 4;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        scatter[i]     = radius * Math.sin(phi) * Math.cos(theta);
        scatter[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
        scatter[i + 2] = radius * Math.cos(phi);
      }
      return scatter;
    }

    // ---------- Animation loop (always running, lerps toward current target) ----------
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      const current = geometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
        current[i]     += (targetPositions[i]     - current[i])     * 0.03;
        current[i + 1] += (targetPositions[i + 1] - current[i + 1]) * 0.03;
        current[i + 2] += (targetPositions[i + 2] - current[i + 2]) * 0.03;

        // gentle floating wave
        current[i + 1] += Math.sin(time + current[i]) * 0.002;
      }
      geometry.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
    }
    animate();

    // ---------- Morph / scatter cycle, driven by Play button ----------
    const IMAGES = ['little-krishna.jpeg', 'radha-krishna.jpeg'];
    const HOLD_MS = 6000;     // how long the formed image stays
    const SCATTER_MS = 4000;  // how long particles stay scattered before next image

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    let cycling = false;
    async function startCycle() {
      if (cycling) return;
      cycling = true;
      let index = 0;
      // preload target sets so there's no stall on first load
      const cache = {};
      for (let i = 0; i < IMAGES.length; i++) {
        try {
          cache[IMAGES[i]] = await loadImageTargets(IMAGES[i]);
        } catch (err) {
          console.warn(`Could not load "${IMAGES[i]}" — check the file is next to this HTML file. Using a scattered cloud instead.`, err);
          cache[IMAGES[i]] = randomScatterPositions();
        }
      }

      while (cycling) {
        targetPositions = cache[IMAGES[index]];
        await wait(HOLD_MS);

        targetPositions = randomScatterPositions();
        await wait(SCATTER_MS);

        index = (index + 1) % IMAGES.length;
      }
    }

    // ---------- Play button ----------
    const playBtn = document.getElementById('play-btn');
    const music = document.getElementById('music');
    playBtn.addEventListener('click', () => {
      playBtn.style.display = 'none';
      // start audio only after a user gesture (browser autoplay policy)
      music.src = 'https://www.youtube.com/embed/WTjZxav7naU?autoplay=1&loop=1&playlist=WTjZxav7naU';
      startCycle();
    });
  </script>
</body>
</html>
