<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Divine Emergence – Little Krishna</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #credit {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: #00ffff;
      font-size: 18px;
      text-shadow: 0 0 10px #ff00ff;
      z-index: 10;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="credit">Developed by Sumiran Sharma</div>
  <canvas id="scene"></canvas>

  <!-- Invisible YouTube player for music -->
  <iframe width="0" height="0"
    src="https://www.youtube.com/embed/WTjZxav7naU?autoplay=1&loop=1&playlist=WTjZxav7naU"
    frameborder="0"
    allow="autoplay">
  </iframe>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>

  <script>
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({canvas});
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const loader = new THREE.TextureLoader();
    const krishnaTexture = loader.load('little-krishna.jpeg');
    const radhaKrishnaTexture = loader.load('radha-krishna.jpeg');

    const material = new THREE.SpriteMaterial({map: krishnaTexture});
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(4, 4, 1);
    scene.add(sprite);

    function animateKrishna() {
      material.map = krishnaTexture;
      gsap.to(sprite.scale, {x: 4, y: 4, duration: 5});
      setTimeout(() => {
        gsap.to(sprite.scale, {x: 0.1, y: 0.1, duration: 5, onComplete: animateRadhaKrishna});
      }, 10000);
    }

    function animateRadhaKrishna() {
      material.map = radhaKrishnaTexture;
      gsap.to(sprite.scale, {x: 4, y: 4, duration: 5});
    }

    function render() {
      requestAnimationFrame(render);
      renderer.render(scene, camera);
    }

    animateKrishna();
    render();
  </script>
</body>
</html>
